services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
  mcp:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      - qdrant
    command: fastmcp run tools.py:mcp -t sse -p 8080 --host 0.0.0.0
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    expose:
      - 8080
  
  agents:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      - mcp
    working_dir: /app
    command: adk api_server --port 8000 
    env_file:
      - .env
    environment:
      - SSE_URL=http://mcp:8080/sse
    ports:
      - 8000:8000

  data-ingestion:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      - qdrant
    command: python index.py 
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATA_DIR=data

configs:
  qdrant_config:
    content: |
      log_level: INFO